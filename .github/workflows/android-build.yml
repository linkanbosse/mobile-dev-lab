name: Android APK Build

on:
  workflow_dispatch:
    inputs:
      warning_mode:
        description: Gradle warning mode
        type: choice
        options: [summary, all, fail, none]
        default: summary
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      WARNING_MODE: ${{ inputs.warning_mode || 'summary' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          (yes || true) | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Lint and unit tests
        run: ./gradlew --no-daemon --warning-mode "$WARNING_MODE" lintDebug testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon --warning-mode "$WARNING_MODE" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-dev-lab-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
