name: Android APK Build

on:
  workflow_dispatch:
    inputs:
      warning_mode:
        description: Gradle warning mode
        type: choice
        options: [summary, all, fail, none]
        default: summary
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      WARNING_MODE: ${{ inputs.warning_mode || 'summary' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          (yes || true) | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.1'

      - name: Generate Gradle wrapper
        run: gradle wrapper --warning-mode "$WARNING_MODE" --gradle-version 9.8.1 --distribution-type bin

      - name: Lint and unit tests
        run: ./gradlew --no-daemon --warning-mode "$WARNING_MODE" lintDebug testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon --warning-mode "$WARNING_MODE" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: mobile-dev-lab-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
